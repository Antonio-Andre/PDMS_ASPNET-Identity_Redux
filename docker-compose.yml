services:
  db:
    image: postgres:15-alpine
    container_name: pdms_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: dbsecret
      POSTGRES_DB: pdms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./PDMS_ASPNET-Identity
      dockerfile: Dockerfile
    container_name: pdms_backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pdms_db;Username=admin;Password=secret;SSL Mode=Disable;
    depends_on:
      - db

  frontend:
    build:
      context: ./PDMS_React_RTK
      dockerfile: Dockerfile
    container_name: pdms_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
